# R8 loads the whole program into memory to shrink it, and it runs inside the Gradle
# daemon. 512 MB of Metaspace is enough for the Kotlin compiler but not for R8, which
# then spends the build thrashing the garbage collector.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=false
org.gradle.caching=true
# The configuration cache stays off: the NewPipe re-jar task in :core pulls in
# script objects Gradle cannot serialize, and the build fails at the end.
kotlin.compiler.execution.strategy=in-process
systemProp.java.net.preferIPv4Stack=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.10 recommends compileSdk 36 at most; 37 is needed for InnerTubeX and builds fine.
android.suppressUnsupportedCompileSdk=37,37.0
